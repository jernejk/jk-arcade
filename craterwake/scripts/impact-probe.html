<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Craterwake impact timing</title>
  <style>
    html,
    body {
      margin: 0;
      background: #182c34;
      color: white;
      font: 16px system-ui;
    }
    iframe {
      display: block;
      width: 390px;
      height: 844px;
      border: 0;
    }
    pre {
      white-space: pre-wrap;
      padding: 12px;
    }
  </style>
  <button id="run">Measure flight and impact</button>
  <pre id="report" aria-live="polite">390 × 844 · Seed 824 · Full motion</pre>
  <script type="module">
    import { measureSalvo, summarize } from './salvo-timing.js';
    const button = document.querySelector('#run'),
      report = document.querySelector('#report');
    const scenarios = ['chain', 'armour'];
    function summary(samples) {
      const { frames, p50, p95, max, over } = summarize(samples);
      return `${frames} frames · p50 ${p50.toFixed(1)} · p95 ${p95.toFixed(1)} · max ${max.toFixed(1)} ms · >33.5 ms: ${over}`;
    }
    async function replaySequence(scenario) {
      const frame = document.createElement('iframe');
      frame.title = 'Seeded ' + scenario + ' replay';
      frame.src = '../?seed=824';
      const ready = new Promise((resolve) => (frame.onload = resolve));
      document.body.prepend(frame);
      try {
        await ready;
        const win = frame.contentWindow,
          doc = win.document;
        if (win.innerWidth !== 390 || win.innerHeight !== 844)
          throw Error(
            'Expected 390 × 844, got ' +
              win.innerWidth +
              ' × ' +
              win.innerHeight,
          );
        if (win.matchMedia('(prefers-reduced-motion: reduce)').matches)
          throw Error('Full motion is required to measure the debris spray.');
        const fresh = await replay(win, doc, scenario);
        const restarted = await replay(win, doc, scenario);
        const loaded = new Promise((resolve) => (frame.onload = resolve));
        win.location.reload();
        await loaded;
        const reloaded = await replay(
          frame.contentWindow,
          frame.contentDocument,
          scenario,
        );
        return {
          fresh,
          'in-session restart': restarted,
          'frame reload': reloaded,
        };
      } finally {
        frame.remove();
      }
    }
    async function replay(win, doc, scenario) {
      doc.querySelector('#start').click();
      const measurement = measureSalvo(win, scenario);
      await new Promise((r) => win.setTimeout(r, 400));
      if (scenario === 'armour') {
        for (let i = 0; i < 8; i++)
          doc.dispatchEvent(
            new win.KeyboardEvent('keydown', { key: 'd', bubbles: true }),
          );
        const power = doc.querySelector('#throttle');
        power.value = '75';
        power.dispatchEvent(new win.Event('input'));
      }
      doc.querySelector('#fire').click();
      return measurement;
    }
    button.onclick = async () => {
      button.disabled = true;
      const lines = [],
        pooled = new Map();
      try {
        for (let run = 1; run <= 3; run++) {
          for (const scenario of scenarios) {
            const sequence = await replaySequence(scenario);
            for (const [mode, phases] of Object.entries(sequence)) {
              for (const [phase, samples] of Object.entries(phases)) {
                const name = [scenario, mode, phase].join(' · ');
                if (!pooled.has(name)) pooled.set(name, []);
                pooled.get(name).push(...samples);
                const peak = samples.indexOf(Math.max(...samples)) + 1;
                lines.push(
                  name +
                    ' ' +
                    run +
                    ' · ' +
                    summary(samples) +
                    ' · peak at interval ' +
                    peak +
                    ' · first four ' +
                    samples
                      .slice(0, 4)
                      .map((ms) => ms.toFixed(1))
                      .join('/') +
                    ' ms',
                );
              }
            }
            report.textContent = lines.join('\n');
          }
        }
        report.textContent =
          [...pooled]
            .map(([name, all]) => name + ' total · ' + summary(all))
            .join('\n') +
          '\n\n' +
          lines.join('\n');
      } catch (e) {
        report.textContent += '\n' + e.message;
      } finally {
        button.disabled = false;
      }
    };
  </script>
</html>
